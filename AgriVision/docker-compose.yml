version: "3.8"
services:
  pipeline:
    build: .
    container_name: agrivision-pipeline
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    command: ["./run_pipeline.sh"]

  webui:
    build: .
    container_name: agrivision-webui
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "app.py"]
